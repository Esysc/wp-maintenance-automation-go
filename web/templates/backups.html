<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_backups" data-i18n-prefix="WP Maintenance Automation - ">{{.Title}} - Backups</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>WP Maintenance</h2>
        </div>
        <ul class="nav-list">
            <li><a href="/dashboard" class="{{if eq .ActivePage "dashboard"}}active{{end}}" data-i18n="nav_dashboard">Dashboard</a></li>
            <li><a href="/sites" class="{{if eq .ActivePage "sites"}}active{{end}}" data-i18n="nav_sites">Sites</a></li>
            <li><a href="/backups" class="{{if eq .ActivePage "backups"}}active{{end}}" data-i18n="nav_backups">Backups</a></li>
            <li><a href="/restore" class="{{if eq .ActivePage "restore"}}active{{end}}" data-i18n="nav_restore">Restore</a></li>
            <li><a href="/upgrade" class="{{if eq .ActivePage "upgrade"}}active{{end}}" data-i18n="nav_upgrade">Upgrade</a></li>
            <li><a href="/snapshots" class="{{if eq .ActivePage "snapshots"}}active{{end}}" data-i18n="nav_snapshots">Snapshots</a></li>
            <li><a href="/healthcheck" class="{{if eq .ActivePage "healthcheck"}}active{{end}}" data-i18n="nav_healthcheck">Health Checks</a></li>
            <li><a href="/users" class="{{if eq .ActivePage "users"}}active{{end}}" data-i18n="nav_users">Users</a></li>
            <li><a href="/tokens" class="{{if eq .ActivePage "tokens"}}active{{end}}" data-i18n="nav_tokens">API Tokens</a></li>
            <li><a href="/system" class="{{if eq .ActivePage "system"}}active{{end}}" data-i18n="nav_system">System</a></li>
            <li><a href="/api/docs" class="{{if eq .ActivePage "docs"}}active{{end}}" data-i18n="nav_docs">Documentation</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/login" onclick="document.cookie='token=; Max-Age=0; path=/'; return true;" data-i18n="nav_logout">Logout</a>
        </div>
    </nav>
    <main class="main-content">
        <header class="page-header">
            <h1 data-i18n="page_title_backups">Backups</h1>
            <div class="header-actions">
                <select id="siteSelector" onchange="loadBackups();loadLatestJob()" class="site-selector">
                    <option value="" disabled selected data-i18n="label_select_site">Select Site</option>
                </select>
                <button class="btn btn-primary" onclick="runBackup()" data-i18n="btn_run_backup_now">Run Backup Now</button>
            </div>
        </header>
        <div class="card">
            <table id="backupsTable">
                <thead>
                    <tr>
                        <th data-i18n="table_timestamp">Timestamp</th>
                        <th data-i18n="table_host">Host</th>
                        <th data-i18n="table_wp_version">WordPress Version</th>
                        <th data-i18n="table_database">Database</th>
                        <th data-i18n="table_files">Files</th>
                        <th data-i18n="table_actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="backupsBody"></tbody>
            </table>
        </div>
        <div id="backupResult" style="display:none;" class="result-box"></div>
        <div id="jobStatus" style="display:none;" class="result-box"></div>
    </main>
    <script src="/static/js/app.js"></script>
    <script>
    function toProgressPercent(job) {
        if (!job) return 0;
        if (typeof job.progress_percent === 'number') return Math.max(0, Math.min(100, job.progress_percent));
        if (job.status === 'completed') return 100;
        return 0;
    }

    function jobStatusLabel(job) {
        return App.t('job_status_' + (job && job.status ? job.status : 'queued'));
    }

    function jobTypeLabel(job) {
        return App.t('job_type_' + (job && job.type ? job.type : 'backup'));
    }

    function jobProgressLabel(job) {
        if (!job) return App.t('job_progress_pending');
        if (job.status === 'failed') return job.error || App.t('job_progress_failed');
        if (job.status === 'completed') return App.t('job_progress_completed');
        return App.t(job.progress || 'job_progress_pending');
    }

    function renderJobStatus(el, job) {
        if (!el || !job) return;
        const pct = toProgressPercent(job);
        el.style.display = 'block';
        el.className = 'result-box ' + (job.status === 'completed' ? 'success' : job.status === 'failed' ? 'error' : 'info');
        el.innerHTML = `<div class="job-progress-header"><span>${App.escapeHTML(jobTypeLabel(job))} • ${App.escapeHTML(jobStatusLabel(job))}</span><span>${pct}%</span></div>
            <div class="job-progress-detail">${App.escapeHTML(jobProgressLabel(job))}</div>
            <div class="job-progress-track"><div class="job-progress-fill" style="width:${pct}%"></div></div>`;
    }

    async function loadLatestJob() {
        const siteId = document.getElementById('siteSelector').value;
        const el = document.getElementById('jobStatus');
        if (!siteId) { el.style.display = 'none'; return; }
        const r = await fetch('/api/v1/jobs?site_id=' + siteId, {
            headers: { 'Authorization': 'Bearer ' + App.getToken() }
        });
        const j = await r.json();
        if (j.success && j.data) {
            renderJobStatus(el, j.data);
        } else {
            el.style.display = 'none';
        }
    }

    async function loadBackups() {
        const siteId = document.getElementById('siteSelector').value;
        if (!siteId) return;

        App.setLoading('backupsBody', true, 'table');
        const resp = await fetch(`/api/v1/backups?site_id=${siteId}`, {
            headers: { 'Authorization': 'Bearer ' + App.getToken() }
        });

        if (resp.status === 401) {
            document.cookie = 'token=; Max-Age=0; path=/';
            window.location.href = '/login';
            return;
        }

        const raw = await resp.text();
        let result = null;
        try {
            result = raw ? JSON.parse(raw) : null;
        } catch (_) {
            App.toast(App.t('error_loading_data') + ' (' + resp.status + ')', 'error');
            App.setLoading('backupsBody', false, 'table');
            return;
        }

        if (result && result.success && result.data) {
            const tbody = document.getElementById('backupsBody');
            tbody.innerHTML = '';
            const items = Array.isArray(result.data) ? result.data : [];
            items.forEach(b => {
                tbody.innerHTML += `<tr>
                    <td>${b.timestamp || '-'}</td>
                    <td>${b.host || b.ssh_host || '-'}</td>
                    <td>${b.wp_version || '-'}</td>
                    <td>${b.db_name || '-'}</td>
                    <td>${b.file_count || 0}</td>
                    <td><button onclick="deleteBackup('${App.escapeHTML(String(b.id || ''))}')" class="btn btn-danger btn-sm">${App.t('btn_delete')}</button></td>
                </tr>`;
            });
            App.reveal();
        } else {
            const tbody = document.getElementById('backupsBody');
            tbody.innerHTML = '';
            App.toast((result && result.error) || App.t('error_loading_data'), 'error');
        }
        App.setLoading('backupsBody', false, 'table');
    }

    async function pollJob(jobId, el, onDone) {
        const poll = async () => {
            const r = await fetch('/api/v1/jobs/' + jobId, {
                headers: { 'Authorization': 'Bearer ' + App.getToken() }
            });
            const j = await r.json();
            if (j.success && j.data) {
                renderJobStatus(el, j.data);
                if (j.data.status === 'completed') {
                    if (onDone) onDone();
                    return;
                } else if (j.data.status === 'failed') {
                    return;
                }
                setTimeout(poll, 2000);
            }
        };
        setTimeout(poll, 1000);
    }

    async function runBackup() {
        const siteId = document.getElementById('siteSelector').value;
        if (!siteId) {
            App.toast(App.t('error_site_id_required'), 'error');
            return;
        }

        const resp = await fetch('/api/v1/backup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + App.getToken()
            },
            body: JSON.stringify({ site_id: siteId })
        });
        const result = await resp.json();
        const el = document.getElementById('backupResult');
        el.style.display = 'block';

        if (result.success && result.data && result.data.job_id) {
            el.textContent = App.t('backup_queued') || 'Backup queued, waiting for completion...';
            el.className = 'result-box info';
            App.toast(App.t('backup_job_started'), 'info');
            pollJob(result.data.job_id, el, () => { loadBackups(); setTimeout(() => loadBackups(), 2000); });
        } else {
            el.textContent = result.error || App.t('backup_failed');
            el.className = 'result-box error';
        }
    }

    async function deleteBackup(id) {
        if (!(await App.confirm(App.t('modal_backup_confirmation') + ' ' + id + '?', App.t('modal_delete_backup')))) return;
        const siteId = document.getElementById('siteSelector').value;
        await fetch(`/api/v1/backups/${id}?site_id=${siteId}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + App.getToken() }
        });
        App.toast(App.t('backup_deleted'), 'success');
        loadBackups();
    }

    App.loadSitesForSelector('siteSelector');
    loadLatestJob();
    loadBackups();
    </script>
</body>
</html>
