<IfModule mod_ssl.c>
  <VirtualHost _default_:443>
    DocumentRoot /var/www/html
    SSLEngine on
    # Only default to https when the caller did not provide a forwarded
    # protocol. The rehearsal preview proxy forwards the application's real
    # scheme so WordPress does not force an HTTPS redirect on HTTP installs.
    SetEnvIf X-Forwarded-Proto "^$" HTTP_X_FORWARDED_PROTO=https
    SSLCertificateFile /etc/apache2/ssl/localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/localhost.key
    <Directory /var/www/html>
      Options FollowSymLinks
      AllowOverride All
      Require all granted
    </Directory>
  </VirtualHost>
</IfModule>
