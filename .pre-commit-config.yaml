repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-symlinks

  - repo: local
    hooks:
      - id: go-fmt
        name: Go format check
        entry: >-
          bash -c 'ROOT="$(git rev-parse --show-toplevel)" && go -C "$ROOT" fmt ./... >/dev/null 2>&1'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: Go compile check
        entry: >-
          bash -c 'ROOT="$(git rev-parse --show-toplevel)"; AVAIL_KB="$(df -Pk "$ROOT" | tail -1 | tr -s " " | cut -d " " -f4)"; if [ "${AVAIL_KB:-0}" -lt 262144 ]; then echo "Skipping Go compile check: low disk space (${AVAIL_KB}KB available)."; exit 0; fi; go -C "$ROOT" vet ./... >/dev/null 2>&1'
        language: system
        types: [go]
        pass_filenames: false

      - id: ts-build
        name: TypeScript React type check
        entry: >-
          bash -c 'ROOT="$(git rev-parse --show-toplevel)"; AVAIL_KB="$(df -Pk "$ROOT" | tail -1 | tr -s " " | cut -d " " -f4)"; if [ "${AVAIL_KB:-0}" -lt 262144 ]; then echo "Skipping TypeScript type check: low disk space (${AVAIL_KB}KB available)."; exit 0; fi; cd "$ROOT/web/ui" && npx tsc --noEmit >/dev/null 2>&1'
        language: system
        pass_filenames: false
