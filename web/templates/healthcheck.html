<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_healthcheck" data-i18n-prefix="WP Maintenance Automation - ">{{.Title}} - Health Check</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>WP Maintenance</h2>
        </div>
        <ul class="nav-list">
            <li><a href="/dashboard" class="{{if eq .ActivePage "dashboard"}}active{{end}}" data-i18n="nav_dashboard">Dashboard</a></li>
            <li><a href="/sites" class="{{if eq .ActivePage "sites"}}active{{end}}" data-i18n="nav_sites">Sites</a></li>
            <li><a href="/backups" class="{{if eq .ActivePage "backups"}}active{{end}}" data-i18n="nav_backups">Backups</a></li>
            <li><a href="/restore" class="{{if eq .ActivePage "restore"}}active{{end}}" data-i18n="nav_restore">Restore</a></li>
            <li><a href="/upgrade" class="{{if eq .ActivePage "upgrade"}}active{{end}}" data-i18n="nav_upgrade">Upgrade</a></li>
            <li><a href="/snapshots" class="{{if eq .ActivePage "snapshots"}}active{{end}}" data-i18n="nav_snapshots">Snapshots</a></li>
            <li><a href="/healthcheck" class="{{if eq .ActivePage "healthcheck"}}active{{end}}" data-i18n="nav_healthcheck">Health Checks</a></li>
            <li><a href="/users" class="{{if eq .ActivePage "users"}}active{{end}}" data-i18n="nav_users">Users</a></li>
            <li><a href="/tokens" class="{{if eq .ActivePage "tokens"}}active{{end}}" data-i18n="nav_tokens">API Tokens</a></li>
            <li><a href="/system" class="{{if eq .ActivePage "system"}}active{{end}}" data-i18n="nav_system">System</a></li>
            <li><a href="/api/docs" class="{{if eq .ActivePage "docs"}}active{{end}}" data-i18n="nav_docs">Documentation</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/login" onclick="document.cookie='token=; Max-Age=0; path=/'; return true;" data-i18n="nav_logout">Logout</a>
        </div>
    </nav>
    <main class="main-content">
        <header class="page-header"><h1 data-i18n="page_title_healthcheck">Health Check</h1></header>
        <div class="card">
            <form id="healthcheckForm">
                <div class="form-group">
                    <label for="hcUrl" data-i18n="form_url_check">URL to check</label>
                    <input type="url" id="hcUrl" name="url" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="hcExpectedCode" data-i18n="form_expected_code">Expected HTTP Status</label>
                    <input type="number" id="hcExpectedCode" value="200">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary" data-i18n="btn_health_check">Run Check</button>
                </div>
            </form>
        </div>
        <div id="hcResult" style="display:none;" class="result-box"></div>
    </main>
    <script src="/static/js/app.js"></script>
    <script>
    document.getElementById('healthcheckForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            url: document.getElementById('hcUrl').value,
            expected_code: parseInt(document.getElementById('hcExpectedCode').value)
        };
        const resp = await fetch('/api/v1/healthcheck', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + App.getToken() },
            body: JSON.stringify(body)
        });
        const result = await resp.json();
        const el = document.getElementById('hcResult');
        el.style.display = 'block';
        if (result.success && result.data) {
            el.innerHTML = `${App.t('health_label_status')}: ${result.data.status_code ?? '-'}, ${App.t('health_label_expected')}: ${result.data.expected_code ?? '-'}, ${App.t('health_label_passed')}: ${result.data.passed ? App.t('option_yes') : App.t('option_no')}, ${App.t('health_label_response')}: ${result.data.response_time_ms ?? '-'}ms`;
            el.className = 'result-box ' + (result.data.passed ? 'success' : 'error');
            App.toast(result.data.passed ? App.t('health_check_passed') : App.t('health_check_failed'), result.data.passed ? 'success' : 'error');
        } else {
            el.textContent = result.error || App.t('error_check_failed');
            el.className = 'result-box error';
            App.toast(result.error || App.t('health_check_failed_error'), 'error');
        }
    });
    </script>
</body>
</html>
