<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_sites" data-i18n-prefix="WP Maintenance Automation - ">{{.Title}} - Sites</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>WP Maintenance</h2>
        </div>
        <ul class="nav-list">
            <li><a href="/dashboard" class="{{if eq .ActivePage "dashboard"}}active{{end}}" data-i18n="nav_dashboard">Dashboard</a></li>
            <li><a href="/sites" class="{{if eq .ActivePage "sites"}}active{{end}}" data-i18n="nav_sites">Sites</a></li>
            <li><a href="/backups" class="{{if eq .ActivePage "backups"}}active{{end}}" data-i18n="nav_backups">Backups</a></li>
            <li><a href="/restore" class="{{if eq .ActivePage "restore"}}active{{end}}" data-i18n="nav_restore">Restore</a></li>
            <li><a href="/upgrade" class="{{if eq .ActivePage "upgrade"}}active{{end}}" data-i18n="nav_upgrade">Upgrade</a></li>
            <li><a href="/snapshots" class="{{if eq .ActivePage "snapshots"}}active{{end}}" data-i18n="nav_snapshots">Snapshots</a></li>
            <li><a href="/healthcheck" class="{{if eq .ActivePage "healthcheck"}}active{{end}}" data-i18n="nav_healthcheck">Health Checks</a></li>
            <li><a href="/users" class="{{if eq .ActivePage "users"}}active{{end}}" data-i18n="nav_users">Users</a></li>
            <li><a href="/tokens" class="{{if eq .ActivePage "tokens"}}active{{end}}" data-i18n="nav_tokens">API Tokens</a></li>
            <li><a href="/system" class="{{if eq .ActivePage "system"}}active{{end}}" data-i18n="nav_system">System</a></li>
            <li><a href="/api/docs" class="{{if eq .ActivePage "docs"}}active{{end}}" data-i18n="nav_docs">Documentation</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/login" onclick="document.cookie='token=; Max-Age=0; path=/'; return true;" data-i18n="nav_logout">Logout</a>
        </div>
    </nav>
    <main class="main-content">
        <header class="page-header">
            <h1 data-i18n="page_title_sites">Sites</h1>
            <button class="btn btn-primary" onclick="showCreateSite()" data-i18n="btn_add_site">Add Site</button>
        </header>

        <div class="card">
            <div id="sitesBody" class="list-grid"></div>
        </div>
    </main>

    <div id="createSiteModal" class="modal" aria-hidden="true">
        <button class="modal-backdrop" data-close-modal="createSiteModal"></button>
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 id="siteModalTitle" data-i18n="modal_create_site">Create Site</h3>
                <button type="button" class="icon-btn" data-close-modal="createSiteModal">x</button>
            </div>
            <div class="modal-body">
                <form id="siteCreateForm">
                    <div class="field-floating"><input type="text" id="siteName" placeholder=" " required><label data-i18n="form_site_name">Site Name</label></div>
                    <div class="field-floating"><input type="text" id="siteSSHHost" placeholder=" " required><label data-i18n="form_ssh_host">SSH Host</label></div>
                    <div class="field-floating"><input type="number" id="siteSSHPort" placeholder=" " value="22"><label data-i18n="form_ssh_port">SSH Port</label></div>
                    <div class="field-floating"><input type="text" id="siteSSHUser" placeholder=" " required><label data-i18n="form_ssh_user">SSH User</label></div>
                    <div class="field-floating"><textarea id="siteSSHKey" placeholder=" " style="min-height:60px"></textarea><label data-i18n="form_ssh_key">SSH Private Key (optional)</label></div>
                    <div class="field-floating"><input type="text" id="siteWPRoot" placeholder=" " value="/var/www/html" required><label data-i18n="form_wp_root">WordPress Root</label></div>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="detectSiteConfig()" data-i18n="btn_detect_config" style="margin-bottom: 16px;">Detect Configuration via SSH</button>
                    <div class="field-floating"><input type="text" id="siteDBHost" placeholder=" " readonly><label data-i18n="form_db_host">Database Host</label></div>
                    <div class="field-floating"><input type="text" id="siteDBUser" placeholder=" " readonly><label data-i18n="form_db_user">Database User</label></div>
                    <div class="field-floating"><input type="password" id="siteDBPassword" placeholder=" " autocomplete="new-password" readonly><label data-i18n="form_db_password">Database Password</label></div>
                    <div class="field-floating"><input type="text" id="siteDBName" placeholder=" " readonly><label data-i18n="form_db_name">Database Name</label></div>
                    <div class="field-floating"><input type="text" id="siteResticRepo" placeholder=" " required><label data-i18n="form_restic_repo">Restic Repository</label></div>
                    <label style="display:flex;align-items:center;gap:6px;margin:4px 0 12px;font-size:0.9em">
                        <input type="checkbox" id="siteLocalRestic" onchange="toggleLocalRestic()">
                        <span data-i18n="form_local_restic">Use local storage (/app/backup_artifacts/restic-repo)</span>
                    </label>
                    <div class="field-floating"><input type="text" id="siteResticPassFile" placeholder=" "><label data-i18n="form_restic_pass_file">Restic Password File</label></div>
                    <div class="field-floating"><input type="text" id="siteBackupDir" placeholder=" " value="./backups"><label data-i18n="form_backup_dir">Backup Directory</label></div>
                    <div class="field-floating"><input type="text" id="siteRetention" placeholder=" " value="--keep-daily 7 --keep-weekly 4"><label data-i18n="form_retention_flags">Retention Flags</label></div>
                    <div class="field-floating"><input type="text" id="siteHealthcheckURL" placeholder=" "><label data-i18n="form_healthcheck_url">Healthcheck URL</label></div>
                    <div class="field-floating">
                        <select id="siteStagingEnabled">
                            <option value="0" selected data-i18n="option_no">No</option>
                            <option value="1" data-i18n="option_yes">Yes</option>
                        </select>
                        <label data-i18n="form_staging_enabled">Staging Enabled</label>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn" onclick="hideCreateSite()" data-i18n="btn_cancel">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="siteSubmitBtn" data-i18n="btn_create_site">Create Site</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
    let editingSiteId = '';
    const sitesById = {};

    async function loadSites() {
        App.setLoading('sitesBody', true, 'cards');
        const resp = await fetch('/api/v1/sites', { headers: { 'Authorization': 'Bearer ' + App.getToken() } });
        const result = await resp.json();
        if (result.success && result.data) {
            const list = document.getElementById('sitesBody');
            list.innerHTML = '';
            Object.keys(sitesById).forEach((id) => delete sitesById[id]);
            result.data.forEach((s) => {
                sitesById[s.id] = s;
                const statusBadge = s.staging_enabled ?
                    '<span class="badge badge-success">' + App.escapeHTML(App.t('site_staging_enabled_badge')) + '</span>' :
                    '<span class="badge badge-muted">' + App.escapeHTML(App.t('site_production_only_badge')) + '</span>';

                list.innerHTML += `<article class="entity-card">
                    <div class="entity-title">${App.escapeHTML(s.name || '-')}</div>
                    <div class="entity-meta">${App.t('site_label_host')}: ${App.escapeHTML(s.wp_ssh_host || '-')}</div>
                    <div class="entity-meta">${App.t('site_label_ssh_user')}: ${App.escapeHTML(s.wp_ssh_user || '-')}</div>
                    <div class="entity-meta">${App.t('site_label_wp_root')}: <code>${App.escapeHTML(s.wp_root || '-')}</code></div>
                    <div class="entity-meta">${statusBadge}</div>
                    <div class="entity-actions">
                        <button onclick="editSite('${App.escapeHTML(s.id || '')}')" class="btn btn-sm">${App.t('btn_edit')}</button>
                        <button onclick="deleteSite('${App.escapeHTML(s.id || '')}')" class="btn btn-danger btn-sm">${App.t('btn_delete')}</button>
                    </div>
                </article>`;
            });
            App.reveal();
        } else if (result.success) {
            document.getElementById('sitesBody').innerHTML = '<div class="empty-state">' + App.t('no_sites_configured') + '</div>';
        }
        App.setLoading('sitesBody', false, 'cards');
    }

    async function deleteSite(id) {
        if (!(await App.confirm(App.t('modal_delete_confirmation'), App.t('modal_delete_site')))) return;
        const resp = await fetch('/api/v1/sites/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + App.getToken() }
        });
        const result = await resp.json();
        if (result.success) {
            App.toast(App.t('site_deleted'), 'success');
            loadSites();
        } else {
            App.toast((result.error || App.t('site_failed_delete')), 'error');
        }
    }

    function editSite(id) {
        const site = sitesById[id];
        if (!site) {
            App.toast(App.t('error_unable_load_sites'), 'error');
            return;
        }

        editingSiteId = id;
        document.getElementById('siteModalTitle').textContent = App.t('modal_edit_site');
        document.getElementById('siteSubmitBtn').textContent = App.t('btn_save_changes');
        document.getElementById('siteName').value = site.name || '';
        document.getElementById('siteSSHHost').value = site.wp_ssh_host || '';
        document.getElementById('siteSSHPort').value = site.wp_ssh_port || 22;
        document.getElementById('siteSSHUser').value = site.wp_ssh_user || '';
        document.getElementById('siteSSHKey').value = site.wp_ssh_key || '';
        document.getElementById('siteWPRoot').value = site.wp_root || '/var/www/html';
        document.getElementById('siteDBHost').value = site.db_host || '';
        document.getElementById('siteDBUser').value = site.db_user || '';
        document.getElementById('siteDBPassword').value = site.db_password || '';
        document.getElementById('siteDBName').value = site.db_name || '';
        document.getElementById('siteResticRepo').value = site.restic_repository || '';
        document.getElementById('siteLocalRestic').checked = (site.restic_repository || '') === 'local:/app/backup_artifacts/restic-repo';
        document.getElementById('siteResticPassFile').value = site.restic_password_file || '';
        document.getElementById('siteBackupDir').value = site.backup_dir || './backups';
        document.getElementById('siteRetention').value = site.retention_flags || '--keep-daily 7 --keep-weekly 4';
        document.getElementById('siteHealthcheckURL').value = site.healthcheck_url || '';
        document.getElementById('siteStagingEnabled').value = site.staging_enabled ? '1' : '0';
        App.openModal('createSiteModal');
    }

    function showCreateSite() {
        editingSiteId = '';
        document.getElementById('siteModalTitle').textContent = App.t('modal_create_site');
        document.getElementById('siteSubmitBtn').textContent = App.t('btn_create_site');
        document.getElementById('siteCreateForm').reset();
        document.getElementById('siteLocalRestic').checked = false;
        App.openModal('createSiteModal');
    }
    function hideCreateSite() { App.closeModal(); }

    function toggleLocalRestic() {
        const cb = document.getElementById('siteLocalRestic');
        if (cb && cb.checked) {
            document.getElementById('siteResticRepo').value = 'local:/app/backup_artifacts/restic-repo';
        }
    }

    async function detectSiteConfig() {
        const sshHost = document.getElementById('siteSSHHost').value;
        const sshPort = parseInt(document.getElementById('siteSSHPort').value) || 22;
        const sshUser = document.getElementById('siteSSHUser').value;
        const sshKey = document.getElementById('siteSSHKey').value;
        const wpRoot = document.getElementById('siteWPRoot').value;

        if (!sshHost || !sshUser) {
            App.toast(App.t('error_ssh_host_user_required'), 'error');
            return;
        }

        try {
            const resp = await fetch('/api/v1/sites/detect-config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + App.getToken() },
                body: JSON.stringify({
                    ssh_host: sshHost,
                    ssh_port: sshPort,
                    ssh_user: sshUser,
                    ssh_key: sshKey,
                    wp_root: wpRoot
                })
            });
            const result = await resp.json();
            if (result.success && result.data) {
                if (result.data.wp_root) document.getElementById('siteWPRoot').value = result.data.wp_root;
                document.getElementById('siteDBHost').value = result.data.db_host || '';
                document.getElementById('siteDBUser').value = result.data.db_user || '';
                document.getElementById('siteDBPassword').value = result.data.db_password || '';
                document.getElementById('siteDBName').value = result.data.db_name || '';
                App.toast(App.t('config_detected_success'), 'success');
            } else {
                App.toast(App.t('config_detection_failed'), 'error');
            }
        } catch (e) {
            App.toast(App.t('config_detection_failed'), 'error');
        }
    }

    document.getElementById('siteCreateForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const stagingEnabled = document.getElementById('siteStagingEnabled').value === '1';

        const site = {
            name: document.getElementById('siteName').value,
            wp_ssh_host: document.getElementById('siteSSHHost').value,
            wp_ssh_port: parseInt(document.getElementById('siteSSHPort').value) || 22,
            wp_ssh_user: document.getElementById('siteSSHUser').value,
            wp_ssh_key: document.getElementById('siteSSHKey').value || null,
            wp_root: document.getElementById('siteWPRoot').value,
            db_host: document.getElementById('siteDBHost').value || null,
            db_user: document.getElementById('siteDBUser').value || null,
            db_password: document.getElementById('siteDBPassword').value || null,
            db_name: document.getElementById('siteDBName').value || null,
            restic_repository: document.getElementById('siteResticRepo').value || null,
            restic_password_file: document.getElementById('siteResticPassFile').value || null,
            backup_dir: document.getElementById('siteBackupDir').value || './backups',
            retention_flags: document.getElementById('siteRetention').value || '--keep-daily 7',
            healthcheck_url: document.getElementById('siteHealthcheckURL').value || null,
            staging_enabled: stagingEnabled
        };

        const isEdit = editingSiteId !== '';
        const resp = await fetch(isEdit ? '/api/v1/sites/' + editingSiteId : '/api/v1/sites', {
            method: isEdit ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + App.getToken() },
            body: JSON.stringify(site)
        });
        const result = await resp.json();
        if (result.success) {
            hideCreateSite();
            App.toast(isEdit ? App.t('site_updated_successfully') : App.t('site_created_successfully'), 'success');
            editingSiteId = '';
            loadSites();
        } else {
            App.toast((result.error || App.t('site_failed_save')), 'error');
        }
    });

    loadSites();
    </script>
</body>
</html>
