openapi: 3.0.3
info:
  title: WP Maintenance Automation API
  description: |
    RESTful API for WordPress site maintenance automation including backups, upgrades, restores, and health checks.

    ## Authentication
    All endpoints except `/api/v1/health` and `/api/v1/auth/login` require authentication via Bearer token in the `Authorization` header:
    ```
    Authorization: Bearer <token>
    ```

    ## First Login
    At first use, call `/api/v1/auth/login` with a password that meets the requirements:
    - Minimum 8 characters
    - At least one uppercase letter
    - At least one lowercase letter
    - At least one digit

    This will create the internal admin user and return a 24-hour valid token.
  version: 1.0.0
  contact:
    name: WP Maintenance Automation
    url: https://github.com/andreacristalli/wp-maintenance-automation-go

servers:
  - url: /
    description: Same origin as the docs page; /api/v1 is proxied to the API server, so Try it out works without CORS or certificate issues

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      description: Single internal application profile used for web access and token ownership.
      properties:
        id:
          type: string
          description: User ID
        username:
          type: string
          description: Internal username
        display_name:
          type: string
          description: User-facing display name shown in the UI
        icon:
          type: string
          enum: [user, shield, bolt, globe, gear]
          description: Profile icon shown in the UI
        role:
          type: string
          enum: [admin, user, readonly]
          description: Stored role for the internal user, currently always admin in single-user mode
        force_pass:
          type: boolean
          description: Whether password change is required
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        display_name:
          type: string
        icon:
          type: string
          enum: [user, shield, bolt, globe, gear]
      required:
        - display_name
        - icon

    APIToken:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        token:
          type: string
          description: API token value (only returned on creation)
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean

    Site:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        wp_ssh_host:
          type: string
        wp_ssh_port:
          type: integer
          default: 22
        wp_ssh_user:
          type: string
        wp_root:
          type: string
        db_host:
          type: string
        db_user:
          type: string
        db_password:
          type: string
        db_name:
          type: string
        restic_repository:
          type: string
        restic_password_file:
          type: string
        backup_dir:
          type: string
        retention_flags:
          type: string
        healthcheck_url:
          type: string
        staging_enabled:
          type: boolean

    Backup:
      type: object
      properties:
        id:
          type: string
        site_id:
          type: string
        timestamp:
          type: string
        host:
          type: string
        wp_root:
          type: string
        wp_version:
          type: string
        db_name:
          type: string
        db_host:
          type: string
        db_version:
          type: string
        dump_file:
          type: string
        file_count:
          type: integer
        rs_exclude:
          type: string
        retention:
          type: string
        ssh_host:
          type: string
        ssh_user:
          type: string
        ssh_port:
          type: integer
        backup_size:
          type: integer
        checksum:
          type: string
        created_at:
          type: string
          format: date-time

    Snapshot:
      type: object
      properties:
        id:
          type: string
        short_id:
          type: string
        timestamp:
          type: string
        tags:
          type: array
          items:
            type: string

    HealthcheckResult:
      type: object
      properties:
        url:
          type: string
        status_code:
          type: integer
        expected_code:
          type: integer
        passed:
          type: boolean
        attempt:
          type: integer
        max_attempts:
          type: integer
        response_time_ms:
          type: integer
        error_message:
          type: string

    Job:
      type: object
      description: Background job (backup, restore, upgrade, or rehearsal) executed by the worker queue.
      properties:
        id:
          type: string
        type:
          type: string
          enum: [backup, restore, upgrade, rehearsal]
        site_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        progress:
          type: string
          description: i18n key describing the current job step
        progress_percent:
          type: integer
        result:
          type: string
          description: JSON-encoded result payload produced by the job
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobRequest:
      type: object
      description: Payload accepted by the job-enqueueing endpoints.
      properties:
        site_id:
          type: string
        snapshot_id:
          type: string
        auto_rollback:
          type: boolean
          description: Roll back automatically if the post-upgrade health check fails
        healthcheck_url:
          type: string
          description: URL to probe after the upgrade to confirm the site is healthy
        apply_db:
          type: boolean
          description: Restore the database
        apply_files:
          type: boolean
          description: Restore the filesystem
        confirm:
          type: boolean
          description: Set to true to actually run the restore (false performs a dry-run)

    JobEnqueued:
      type: object
      properties:
        message:
          type: string
          example: upgrade queued
        job_id:
          type: string
        status:
          type: string
          example: queued
        snapshot_id:
          type: string
        apply_db:
          type: boolean
        apply_files:
          type: boolean

    RehearsalEnv:
      type: object
      description: Details of a running rehearsal staging environment.
      properties:
        health_url:
          type: string
        compose_file:
          type: string
        project_name:
          type: string
        wp_version:
          type: string
        db_name:
          type: string
        snapshot_id:
          type: string

    RehearsalActive:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
        active:
          type: boolean
        env:
          allOf:
            - $ref: '#/components/schemas/RehearsalEnv'
          nullable: true

    SiteConfig:
      type: object
      description: SSH details used to auto-detect the WordPress database configuration of a site.
      properties:
        ssh_host:
          type: string
        ssh_port:
          type: integer
          default: 22
        ssh_user:
          type: string
        ssh_key:
          type: string
        wp_root:
          type: string
          description: Optional known wp-config.php directory; auto-detected when omitted

    DetectedConfig:
      type: object
      properties:
        wp_root:
          type: string
        db_host:
          type: string
        db_user:
          type: string
        db_password:
          type: string
        db_name:
          type: string

    HostMetrics:
      type: object
      properties:
        hostname:
          type: string
        platform:
          type: string
        os:
          type: string
        arch:
          type: string
        kernel:
          type: string
        uptime_seconds:
          type: integer
        cpus:
          type: integer
        load_avg:
          type: array
          items:
            type: number
        cpu_percent:
          type: number
        memory_total:
          type: integer
        memory_used:
          type: integer
        memory_percent:
          type: number
        disk_total:
          type: integer
        disk_used:
          type: integer
        disk_percent:
          type: number
        available:
          type: boolean
        docker:
          type: object
          nullable: true
          properties:
            name:
              type: string
            operating_system:
              type: string
            os_type:
              type: string
            architecture:
              type: string
            kernel_version:
              type: string
            server_version:
              type: string
            docker_root_dir:
              type: string
            ncpu:
              type: integer
            mem_total:
              type: integer

    Container:
      type: object
      properties:
        name:
          type: string
        image:
          type: string
        state:
          type: string
        status:
          type: string
        running_for:
          type: string
        ports:
          type: string
        cpu_percent:
          type: number
        memory_used:
          type: integer
        memory_limit:
          type: integer
        memory_percent:
          type: number

    Metrics:
      type: object
      properties:
        host:
          $ref: '#/components/schemas/HostMetrics'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'
        containers_available:
          type: boolean
          description: Whether the Docker daemon was reachable
        compose_managed:
          type: boolean
          description: Whether the found containers belong to the managed docker-compose project

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

paths:
  /api/v1/health:
    get:
      summary: Health check endpoint
      description: Returns the API health status and version
      operationId: getHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      version:
                        type: string
                      time:
                        type: string
                        format: date-time
                  success:
                    type: boolean

  /api/v1/status:
    get:
      summary: System status
      description: Returns system status including counts of sites, backups, and snapshots
      operationId: getStatus
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      server:
                        type: string
                      uptime:
                        type: integer
                      sites:
                        type: integer
                      backups:
                        type: integer
                      snapshots:
                        type: integer
                  success:
                    type: boolean

  /api/v1/auth/login:
    post:
      summary: Login / Create admin
      description: |
        At first login, creates the internal admin user with the provided password.
        Subsequent logins authenticate with the password and return a 24h token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Password (min 8 chars, uppercase, lowercase, digit)
              required:
                - password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user_id:
                        type: string
                      username:
                        type: string
                      role:
                        type: string
                      force_pass:
                        type: boolean
                      first_login:
                        type: boolean
                  success:
                    type: boolean
        '400':
          description: Invalid password or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid password

  /api/v1/auth/change-password:
    post:
      summary: Change password
      description: Changes the password for the authenticated user
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                new_password:
                  type: string
              required:
                - user_id
                - new_password
      responses:
        '200':
          description: Password changed successfully
        '401':
          description: Unauthorized
        '403':
          description: Password change required

  /api/v1/users:
    get:
      summary: Get internal profile
      description: Returns the single internal user profile used by the application.
      operationId: getInternalProfile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  success:
                    type: boolean
    put:
      summary: Update internal profile
      description: Updates the display name and icon for the single internal user.
      operationId: updateInternalProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated
        '400':
          description: Invalid request

  /api/v1/users/{id}:
    get:
      summary: Get internal profile by ID
      description: Returns the internal profile when the provided ID matches the internal user.
      operationId: getInternalProfileById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: User not found
    put:
      summary: Update internal profile by ID
      description: Updates the internal profile when the provided ID matches the internal user.
      operationId: updateInternalProfileById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated
    delete:
      summary: Delete internal profile
      description: Not allowed. The internal user cannot be deleted in single-user mode.
      operationId: deleteInternalProfileById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '403':
          description: Internal user cannot be deleted

  /api/v1/tokens:
    get:
      summary: List tokens
      operationId: listTokens
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIToken'
                  success:
                    type: boolean
    post:
      summary: Create token
      description: Creates a token for the single internal user. The owner cannot be selected.
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                duration:
                  type: integer
                  description: Duration in hours
      responses:
        '201':
          description: Token created

  /api/v1/tokens/{id}:
    delete:
      summary: Revoke token
      operationId: revokeToken
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token revoked

  /api/v1/sites:
    get:
      summary: List sites
      operationId: listSites
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                  success:
                    type: boolean
    post:
      summary: Create site
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site'
      responses:
        '201':
          description: Site created

  /api/v1/sites/{id}:
    get:
      summary: Get site by ID
      operationId: getSiteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
    put:
      summary: Update site
      operationId: updateSiteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site'
      responses:
        '200':
          description: Site updated
    delete:
      summary: Delete site
      operationId: deleteSiteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Site deleted

  /api/v1/backups:
    get:
      summary: List backups
      description: List backups, optionally filtered by site_id
      operationId: listBackups
      parameters:
        - name: site_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Backup'
                  success:
                    type: boolean
    post:
      summary: Create backup
      operationId: createBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_id:
                  type: string
              required:
                - site_id
      responses:
        '200':
          description: Backup initiated

  /api/v1/backups/{id}:
    get:
      summary: Get backup by ID
      operationId: getBackupById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '501':
          description: Not implemented
    delete:
      summary: Delete backup
      operationId: deleteBackupById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backup deleted

  /api/v1/snapshots:
    get:
      summary: List restic snapshots
      operationId: listSnapshots
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Snapshot'
                  success:
                    type: boolean

  /api/v1/snapshots/{id}:
    get:
      summary: Get snapshot details
      operationId: getSnapshotById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response

  /api/v1/healthcheck:
    post:
      summary: Run health check
      operationId: runHealthcheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                expected_code:
                  type: integer
                  default: 200
              required:
                - url
      responses:
        '200':
          description: Health check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResult'

  /api/v1/auth/state:
    get:
      summary: Authentication state
      description: Reports whether the internal admin user exists and whether a password change is required.
      operationId: getAuthState
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      setup_required:
                        type: boolean
                        description: True when no internal admin user exists yet
                      force_pass:
                        type: boolean
                        description: True when a password change is required
                  success:
                    type: boolean

  /api/v1/sites/detect-config:
    post:
      summary: Detect site database config
      description: Connects to a site over SSH and detects the WordPress root and database configuration from wp-config.php.
      operationId: detectSiteConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteConfig'
      responses:
        '200':
          description: Detected configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DetectedConfig'
                  success:
                    type: boolean
        '400':
          description: Invalid request body

  /api/v1/backup:
    post:
      summary: Enqueue backup
      description: Queues a backup job for the given site and returns its job ID.
      operationId: enqueueBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_id:
                  type: string
              required:
                - site_id
      responses:
        '202':
          description: Backup queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobEnqueued'
                  success:
                    type: boolean
        '400':
          description: site_id is required
        '503':
          description: Failed to enqueue backup job (queue full or unavailable)

  /api/v1/restore:
    post:
      summary: Restore a snapshot
      description: |
        Restores a site from a restic snapshot. When `confirm` is false a dry-run is performed
        and no job is enqueued; set `confirm: true` together with `apply_db`/`apply_files`
        to run the restore as a background job.
      operationId: restoreSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '200':
          description: Restore dry-run performed (confirm=false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_id:
                        type: string
                      apply_db:
                        type: boolean
                      apply_files:
                        type: boolean
                      status:
                        type: string
                      warning:
                        type: string
                  success:
                    type: boolean
        '202':
          description: Restore queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobEnqueued'
                  success:
                    type: boolean
        '400':
          description: Missing snapshot_id, site_id, or invalid request body
        '503':
          description: Failed to enqueue restore job

  /api/v1/upgrade:
    post:
      summary: Upgrade a site
      description: Queues an upgrade job for the given site, optionally with automatic rollback and a post-upgrade health check.
      operationId: upgradeSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_id:
                  type: string
                auto_rollback:
                  type: boolean
                healthcheck_url:
                  type: string
              required:
                - site_id
      responses:
        '202':
          description: Upgrade queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobEnqueued'
                  success:
                    type: boolean
        '400':
          description: site_id is required
        '503':
          description: Failed to enqueue upgrade job

  /api/v1/staging/cleanup:
    post:
      summary: Clean up a staging environment
      description: Destroys the docker-compose staging environment for the given project.
      operationId: cleanupStaging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                compose_file:
                  type: string
                project_name:
                  type: string
              required:
                - compose_file
                - project_name
      responses:
        '200':
          description: Staging environment cleaned up
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      compose_file:
                        type: string
                      project_name:
                        type: string
                  success:
                    type: boolean
        '400':
          description: compose_file and project_name are required
        '500':
          description: Cleanup failed

  /api/v1/rehearsal:
    post:
      summary: Start a rehearsal
      description: Queues a rehearsal job that spins up a staging environment from the given snapshot.
      operationId: startRehearsal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_id:
                  type: string
                snapshot_id:
                  type: string
              required:
                - site_id
                - snapshot_id
      responses:
        '202':
          description: Rehearsal queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobEnqueued'
                  success:
                    type: boolean
        '400':
          description: site_id and snapshot_id are required
        '503':
          description: Failed to enqueue rehearsal job

  /api/v1/rehearsal/active:
    get:
      summary: Get active rehearsal
      description: Returns the latest rehearsal job for a site and whether its staging environment is currently running.
      operationId: getActiveRehearsal
      parameters:
        - name: site_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RehearsalActive'
                  success:
                    type: boolean
        '400':
          description: site_id is required
        '500':
          description: Failed to load rehearsal job

  /api/v1/rehearsal/{id}:
    get:
      summary: Get rehearsal job
      description: Returns the rehearsal job with the given ID.
      operationId: getRehearsalById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                  success:
                    type: boolean
        '404':
          description: Rehearsal job not found

  /api/v1/rehearsal/{id}/stop:
    post:
      summary: Stop a rehearsal
      description: Destroys the staging environment and cancels the rehearsal job.
      operationId: stopRehearsal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rehearsal stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                  success:
                    type: boolean
        '404':
          description: Rehearsal job not found

  /api/v1/rehearsal/{id}/wpcli:
    post:
      summary: Run wp-cli in a rehearsal
      description: Executes an arbitrary wp-cli command inside the running rehearsal staging environment.
      operationId: runRehearsalWpcli
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: string
                  description: wp-cli arguments, e.g. "option get siteurl"
              required:
                - args
      responses:
        '200':
          description: wp-cli output
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                      output:
                        type: string
                      error:
                        type: string
                  success:
                    type: boolean
        '400':
          description: Rehearsal not ready or args is required
        '404':
          description: Rehearsal job not found

  /api/v1/jobs:
    get:
      summary: List jobs
      description: |
        Lists background jobs. Without filters returns the latest job; pass `all=true` to list every job.
        Filter by `site_id` and/or `type` to scope the results.
      operationId: listJobs
      parameters:
        - name: site_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [backup, restore, upgrade, rehearsal]
        - name: all
          in: query
          schema:
            type: string
            enum: ['0', '1', 'true']
            description: Return all matching jobs instead of only the latest
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: Single latest Job, an array of Jobs (all=true), or null when none found
                    oneOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/Job'
                      - $ref: '#/components/schemas/Job'
                  success:
                    type: boolean
        '500':
          description: Failed to list jobs

  /api/v1/jobs/{id}:
    get:
      summary: Get job by ID
      operationId: getJobById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                  success:
                    type: boolean
        '404':
          description: Job not found
    post:
      summary: Cancel job
      description: Cancels a queued or running job.
      operationId: cancelJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cancelled:
                        type: boolean
                  success:
                    type: boolean
        '500':
          description: Failed to cancel job
    delete:
      summary: Delete job
      operationId: deleteJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                  success:
                    type: boolean
        '500':
          description: Failed to delete job

  /api/v1/metrics:
    get:
      summary: System metrics
      description: Returns host resource metrics and docker container stats for the managed compose project.
      operationId: getMetrics
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Metrics'
                  success:
                    type: boolean
