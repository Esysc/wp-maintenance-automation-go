<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_login" data-i18n-prefix="WP Maintenance Automation - ">{{.Title}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>WP Maintenance Automation</h1>
            <div class="language-selector" style="margin: 16px 0 24px;">
                <label for="loginLanguage" data-language-label>Language</label>
                <select id="loginLanguage" data-language-selector></select>
            </div>
            <h2 id="loginTitle" data-i18n="login_title_normal">Secure access to your automation control room</h2>
            <form id="loginForm">
                <div style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" name="username" value="internal" autocomplete="username">
                </div>
                <div class="field-floating">
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder=" " required>
                    <label for="password" id="passwordLabel" data-i18n="form_password">Password</label>
                    <small class="help-text" id="passwordHelp" data-i18n="help_password_requirements">Minimum 8 characters, must include uppercase, lowercase, and digit</small>
                </div>
                <div class="strength-meter" id="strengthMeter" aria-live="polite">
                    <div class="strength-track">
                        <div class="strength-fill" id="strengthFill" data-strength="0"></div>
                    </div>
                    <div class="strength-text" id="strengthText" data-i18n="strength_enter_password">Enter a password</div>
                </div>
                <div class="field-floating" id="confirmGroup">
                    <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password" placeholder=" " required>
                    <label for="passwordConfirm" data-i18n="form_confirm_password">Confirm Password</label>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="btn_login">Login</button>
                </div>
            </form>
            <div id="loginError" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
    let requiresSetup = false;

    function setLoginMode(setupMode) {
        requiresSetup = setupMode;

        const titleEl = document.getElementById('loginTitle');
        const passwordInput = document.getElementById('password');
        const passwordLabel = document.getElementById('passwordLabel');
        const passwordHelp = document.getElementById('passwordHelp');
        const strengthMeter = document.getElementById('strengthMeter');
        const confirmGroup = document.getElementById('confirmGroup');
        const confirmInput = document.getElementById('passwordConfirm');
        const submitBtn = document.getElementById('submitBtn');

        if (setupMode) {
            titleEl.textContent = App.t('login_title_setup');
            passwordLabel.textContent = App.t('form_new_password');
            passwordHelp.style.display = 'block';
            strengthMeter.style.display = 'block';
            confirmGroup.style.display = 'block';
            confirmInput.required = true;
            passwordInput.autocomplete = 'new-password';
            confirmInput.autocomplete = 'new-password';
            submitBtn.textContent = App.t('btn_set_password_login');
        } else {
            titleEl.textContent = App.t('login_title_normal');
            passwordLabel.textContent = App.t('form_password');
            passwordHelp.style.display = 'none';
            strengthMeter.style.display = 'none';
            confirmGroup.style.display = 'none';
            confirmInput.required = false;
            confirmInput.value = '';
            passwordInput.autocomplete = 'current-password';
            submitBtn.textContent = App.t('btn_login');
        }
    }

    async function detectLoginMode() {
        try {
            const resp = await fetch('/api/auth/state');
            const result = await resp.json();
            if (resp.ok && result.success && result.data) {
                setLoginMode(Boolean(result.data.setup_required));
                return;
            }
        } catch (err) {
            // Fall through to safe default mode.
        }

        setLoginMode(false);
    }

    document.getElementById('password').addEventListener('input', (e) => {
        if (requiresSetup) {
            App.updatePasswordStrength(e.target.value, 'strengthFill', 'strengthText');
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;
        const errorEl = document.getElementById('loginError');
        const submitBtn = document.getElementById('submitBtn');

        errorEl.style.display = 'none';

        if (!password) {
            errorEl.textContent = App.t('auth_password_required');
            errorEl.style.display = 'block';
            return;
        }

        if (requiresSetup) {
            if (password !== passwordConfirm) {
                errorEl.textContent = App.t('auth_passwords_match');
                errorEl.style.display = 'block';
                return;
            }

            if (password.length < 8) {
                errorEl.textContent = App.t('auth_password_min_length');
                errorEl.style.display = 'block';
                return;
            }

            let hasUpper = false;
            let hasLower = false;
            let hasDigit = false;
            for (let c of password) {
                if (c >= 'A' && c <= 'Z') hasUpper = true;
                if (c >= 'a' && c <= 'z') hasLower = true;
                if (c >= '0' && c <= '9') hasDigit = true;
            }
            if (!hasUpper || !hasLower || !hasDigit) {
                errorEl.textContent = App.t('auth_password_requirements');
                errorEl.style.display = 'block';
                return;
            }
        }

        submitBtn.textContent = App.t('btn_processing');
        submitBtn.disabled = true;

        try {
            const payload = { password };
            if (requiresSetup) {
                payload.passwordConfirm = passwordConfirm;
            }

            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await resp.json();

            if (resp.ok && result.success) {
                window.location.href = '/dashboard';
                return;
            }

            errorEl.textContent = result.error || App.t('auth_invalid_password');
            errorEl.style.display = 'block';
        } catch (err) {
            errorEl.textContent = App.t('error_network');
            errorEl.style.display = 'block';
        }

        submitBtn.textContent = requiresSetup ? App.t('btn_set_password_login') : App.t('btn_login');
        submitBtn.disabled = false;
    });

    document.addEventListener('app:languagechange', () => {
        setLoginMode(requiresSetup);
    });

    detectLoginMode();
    </script>
</body>
</html>
