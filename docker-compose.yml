services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-wpmaint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wpmaint}
      POSTGRES_DB: ${DB_NAME:-wpmaintenance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wpmaint} -d ${DB_NAME:-wpmaintenance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - wp-maintenance

  api:
    build: .
    ports:
      - "8081:8081"
    environment:
      - API_PORT=8081
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-wpmaint}
      - DB_PASSWORD=${DB_PASSWORD:-wpmaint}
      - DB_NAME=${DB_NAME:-wpmaintenance}
      - DATA_DIR=/app/data
      - LOG_LEVEL=info
      - DEBUG=false
      - SSH_AUTH_SOCK=/ssh-agent.sock
      - RESTIC_PASSWORD_FILE=/app/data/restic_password
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - HOST_AGENT_URL=${HOST_AGENT_URL:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backup_artifacts:/app/backup_artifacts
      - ./restore:/app/restore
      - ./sandbox-data:/app/sandbox-data
      - ~/.ssh:/root/.ssh:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent.sock:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wp-maintenance

  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./web/static:/app/web/static:ro
      - ./api/docs:/app/api/docs:ro
    environment:
      - WEB_PORT=8080
      - API_URL=http://api:8081
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-wpmaint}
      - DB_PASSWORD=${DB_PASSWORD:-wpmaint}
      - DB_NAME=${DB_NAME:-wpmaintenance}
      - DATA_DIR=/app/data
      - LOG_LEVEL=info
      - DEBUG=false
      - RESTIC_PASSWORD_FILE=/app/data/restic_password
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
    command: ["./web-server"]
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - wp-maintenance

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy_data:/data
      - ./caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    environment:
      - WP_MAINTENANCE_DOMAIN=${WP_MAINTENANCE_DOMAIN:-localhost}
      - WP_MAINTENANCE_HOSTS=${WP_MAINTENANCE_HOSTS:-}
      - WP_MAINTENANCE_DEFAULT_SNI=${WP_MAINTENANCE_DEFAULT_SNI:-${WP_MAINTENANCE_HOSTS:-localhost}}
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - wp-maintenance

  # Optional: MySQL/MariaDB for testing
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=wordpress
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wp-maintenance
    profiles:
      - test

  # Optional: WordPress for testing
  wordpress:
    image: wordpress:latest
    ports:
      - "8082:80"
    environment:
      - WORDPRESS_DB_HOST=mysql:3306
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mysql
    networks:
      - wp-maintenance
    profiles:
      - test

  # Optional: Restic for backup storage
  restic:
    image: restic/restic:latest
    ports:
      - "8000:8000"
    volumes:
      - restic_data:/data
      - ./restic_config:/config
    environment:
      - RESTIC_REPOSITORY=/data
      - RESTIC_PASSWORD_FILE=/config/password
    networks:
      - wp-maintenance
    profiles:
      - backup

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  wordpress_data:
    driver: local
  restic_data:
    driver: local

networks:
  wp-maintenance:
    driver: bridge
