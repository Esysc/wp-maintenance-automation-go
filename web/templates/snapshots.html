<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_snapshots" data-i18n-prefix="WP Maintenance Automation - ">{{.Title}} - Snapshots</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>WP Maintenance</h2>
        </div>
        <ul class="nav-list">
            <li><a href="/dashboard" class="{{if eq .ActivePage "dashboard"}}active{{end}}" data-i18n="nav_dashboard">Dashboard</a></li>
            <li><a href="/sites" class="{{if eq .ActivePage "sites"}}active{{end}}" data-i18n="nav_sites">Sites</a></li>
            <li><a href="/backups" class="{{if eq .ActivePage "backups"}}active{{end}}" data-i18n="nav_backups">Backups</a></li>
            <li><a href="/restore" class="{{if eq .ActivePage "restore"}}active{{end}}" data-i18n="nav_restore">Restore</a></li>
            <li><a href="/upgrade" class="{{if eq .ActivePage "upgrade"}}active{{end}}" data-i18n="nav_upgrade">Upgrade</a></li>
            <li><a href="/snapshots" class="{{if eq .ActivePage "snapshots"}}active{{end}}" data-i18n="nav_snapshots">Snapshots</a></li>
            <li><a href="/healthcheck" class="{{if eq .ActivePage "healthcheck"}}active{{end}}" data-i18n="nav_healthcheck">Health Checks</a></li>
            <li><a href="/users" class="{{if eq .ActivePage "users"}}active{{end}}" data-i18n="nav_users">Users</a></li>
            <li><a href="/tokens" class="{{if eq .ActivePage "tokens"}}active{{end}}" data-i18n="nav_tokens">API Tokens</a></li>
            <li><a href="/system" class="{{if eq .ActivePage "system"}}active{{end}}" data-i18n="nav_system">System</a></li>
            <li><a href="/api/docs" class="{{if eq .ActivePage "docs"}}active{{end}}" data-i18n="nav_docs">Documentation</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/login" onclick="document.cookie='token=; Max-Age=0; path=/'; return true;" data-i18n="nav_logout">Logout</a>
        </div>
    </nav>
    <main class="main-content">
        <header class="page-header"><h1 data-i18n="status_snapshots">Restic Snapshots</h1></header>
        <div class="card">
            <table id="snapshotsTable">
                <thead><tr><th data-i18n="table_id">ID</th><th data-i18n="table_time">Time</th><th data-i18n="table_host">Host</th><th data-i18n="table_tags">Tags</th><th data-i18n="table_paths">Paths</th></tr></thead>
                <tbody id="snapshotsBody"></tbody>
            </table>
        </div>
    </main>
    <script src="/static/js/app.js"></script>
    <script>
    async function loadSnapshots() {
        App.setLoading('snapshotsBody', true, 'table');
        const tbody = document.getElementById('snapshotsBody');

        try {
            const resp = await fetch('/api/v1/snapshots', {
                headers: { 'Authorization': 'Bearer ' + App.getToken() }
            });

            // If middleware redirected us to login, follow that flow explicitly.
            if (resp.redirected && resp.url.includes('/login')) {
                window.location.href = '/login';
                return;
            }

            const contentType = resp.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) {
                throw new Error('Unexpected response format from snapshots endpoint');
            }

            const result = await resp.json();
            if (!resp.ok || !result.success) {
                throw new Error((result && result.error) || 'Failed to load snapshots');
            }

            tbody.innerHTML = '';
            const snapshots = Array.isArray(result.data) ? result.data : [];
            if (snapshots.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">' + App.t('error_no_snapshots') + '</td></tr>';
            } else {
                snapshots.forEach(s => {
                    tbody.innerHTML += `<tr>
                        <td><code>${App.escapeHTML((s.short_id || s.id || '-').substring(0, 16))}</code></td>
                        <td>${App.escapeHTML(s.time || '-')}</td>
                        <td>${App.escapeHTML(s.hostname || s.host || '-')}</td>
                        <td>${App.escapeHTML((s.tags || []).join(', ') || '-')}</td>
                        <td>${App.escapeHTML((s.paths || []).join(', ').substring(0, 60) || '-')}</td>
                    </tr>`;
                });
            }

            App.reveal();
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5">' + App.t('error_snapshots_failed') + '</td></tr>';
            App.toast(err && err.message ? err.message : App.t('error_unable_load_snapshots'), 'error');
        } finally {
            App.setLoading('snapshotsBody', false, 'table');
        }
    }
    loadSnapshots();
    </script>
</body>
</html>
