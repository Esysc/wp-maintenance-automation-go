<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_restore" data-i18n-prefix="WP Maintenance Automation - ">{{.Title}} - Restore</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>WP Maintenance</h2>
        </div>
        <ul class="nav-list">
            <li><a href="/dashboard" class="{{if eq .ActivePage "dashboard"}}active{{end}}" data-i18n="nav_dashboard">Dashboard</a></li>
            <li><a href="/sites" class="{{if eq .ActivePage "sites"}}active{{end}}" data-i18n="nav_sites">Sites</a></li>
            <li><a href="/backups" class="{{if eq .ActivePage "backups"}}active{{end}}" data-i18n="nav_backups">Backups</a></li>
            <li><a href="/restore" class="{{if eq .ActivePage "restore"}}active{{end}}" data-i18n="nav_restore">Restore</a></li>
            <li><a href="/upgrade" class="{{if eq .ActivePage "upgrade"}}active{{end}}" data-i18n="nav_upgrade">Upgrade</a></li>
            <li><a href="/snapshots" class="{{if eq .ActivePage "snapshots"}}active{{end}}" data-i18n="nav_snapshots">Snapshots</a></li>
            <li><a href="/healthcheck" class="{{if eq .ActivePage "healthcheck"}}active{{end}}" data-i18n="nav_healthcheck">Health Checks</a></li>
            <li><a href="/users" class="{{if eq .ActivePage "users"}}active{{end}}" data-i18n="nav_users">Users</a></li>
            <li><a href="/tokens" class="{{if eq .ActivePage "tokens"}}active{{end}}" data-i18n="nav_tokens">API Tokens</a></li>
            <li><a href="/system" class="{{if eq .ActivePage "system"}}active{{end}}" data-i18n="nav_system">System</a></li>
            <li><a href="/api/docs" class="{{if eq .ActivePage "docs"}}active{{end}}" data-i18n="nav_docs">Documentation</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/login" onclick="document.cookie='token=; Max-Age=0; path=/'; return true;" data-i18n="nav_logout">Logout</a>
        </div>
    </nav>
    <main class="main-content">
        <header class="page-header">
            <h1 data-i18n="page_title_restore">Restore Backup</h1>
        </header>
        <div class="card">
            <form id="restoreForm">
                <div class="form-group">
                    <label for="snapshotId" data-i18n="form_snapshot_id">Snapshot ID</label>
                    <input type="text" id="snapshotId" name="snapshot_id" placeholder="latest or snapshot ID" data-i18n-placeholder="placeholder_snapshot_latest" required>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="applyDb" name="apply_db">
                        <span data-i18n="apply_db_restore">Apply Database Restore</span>
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="applyFiles" name="apply_files">
                        <span data-i18n="apply_files_restore">Apply File Restore</span>
                    </label>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-warning" data-i18n="btn_restore">Restore</button>
                </div>
            </form>
        </div>
        <div id="restoreResult" style="display:none;" class="result-box"></div>
    </main>
    <script src="/static/js/app.js"></script>
    <script>
    document.getElementById('restoreForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            snapshot_id: document.getElementById('snapshotId').value,
            apply_db: document.getElementById('applyDb').checked,
            apply_files: document.getElementById('applyFiles').checked
        };
        const resp = await fetch('/api/v1/restore', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + App.getToken()
            },
            body: JSON.stringify(body)
        });
        const result = await resp.json();
        const el = document.getElementById('restoreResult');
        el.style.display = 'block';
        el.textContent = result.message || App.t('restore_initiated');
        el.className = 'result-box ' + (resp.ok ? 'success' : 'error');
        App.toast(resp.ok ? App.t('restore_request_submitted') : App.t('restore_request_failed'), resp.ok ? 'success' : 'error');
    });
    </script>
</body>
</html>
